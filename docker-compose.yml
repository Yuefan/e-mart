# Self-hosted deployment (spec §2.2).
#
#   docker compose --env-file .env.production up -d --build
#
# Four services, one image build:
#   db      — PostgreSQL 16, data on a named volume
#   migrate — runs once against db, applies pending migrations, exits
#   web     — the Next.js standalone server
#   worker  — the polling worker: scheduled syncs, audits, content jobs
#
# caddy is optional; drop it if you already terminate TLS elsewhere.

name: ai-marketing-dashboard

x-app-env: &app-env
  # db is the compose service name; the port is not published to the host.
  DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marketing}?schema=public&connection_limit=10"
  APP_URL: ${APP_URL:?set APP_URL to the public https origin}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?missing}
  SESSION_SECRET: ${SESSION_SECRET:?missing}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  # native | tool. Must be "tool" for any non-Anthropic endpoint — see
  # docs/ai-gateway-setup.md. Missing it here would leave the container on the
  # default while .env says otherwise, and every AI call would fail validation.
  AI_STRUCTURED_MODE: ${AI_STRUCTURED_MODE:-native}
  AI_MODEL_ANALYSIS: ${AI_MODEL_ANALYSIS:-claude-opus-5}
  AI_MODEL_FAST: ${AI_MODEL_FAST:-claude-haiku-4-5}
  AI_EFFORT: ${AI_EFFORT:-medium}
  AI_MAX_MONTHLY_USD: ${AI_MAX_MONTHLY_USD:-50}
  # Only meaningful if the host needs a proxy to reach Google / the AI gateway.
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  HTTP_PROXY: ${HTTP_PROXY:-}
  # db must never go through the proxy.
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-marketing}
      # Deterministic collation; avoids index corruption warnings if the base
      # image's libc changes between upgrades.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without the -d flag pg_isready reports ready during initdb, before the
      # application database exists, and migrate then fails on connect.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-marketing}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    # Not published. Use `docker compose exec db psql` to get a shell.

  migrate:
    build:
      context: .
      target: toolbox
    command: npx prisma migrate deploy
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Published on loopback only; caddy is the public entry point. Drop the
    # 127.0.0.1 prefix if you are fronting this with something else.
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    build:
      context: .
      target: toolbox
    command: npm run worker
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # One worker only. The queue's claim lock is designed for correctness, not
    # throughput, and a second consumer buys nothing at this volume.
    deploy:
      replicas: 1

  # Opt-in: `docker compose --profile caddy up -d`.
  #
  # Off by default because a server that already runs a web server — which is
  # the common case when you are adding this to an existing box — has 80 and
  # 443 taken. Binding them anyway would take that site down. Without this
  # profile, `web` listens on 127.0.0.1:3000 and you point your existing nginx
  # or Caddy at it; docs/deployment.md has the vhost.
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Only Caddy needs this; compose interpolates it even when the profile is
      # off, so it cannot be a required variable.
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  caddy-config:
